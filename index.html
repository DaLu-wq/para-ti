<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Programmed Love - Corazón Real</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            perspective: 1000px;
        }

        .container {
            position: relative;
            transform-style: preserve-3d;
            /* Ajusta el tamaño visual del corazón aquí */
            width: 600px; 
            height: 600px;
        }

        .love-word {
            color: #ea80b0;
            font-size: 1.2rem;
            font-family: Arial, sans-serif;
            position: absolute;
            text-shadow: 0 0 10px #ffb3d9;
            white-space: nowrap;
            opacity: 0;
            animation: heart-anim 4s infinite linear;
        }

        @keyframes heart-anim {
            0% { opacity: 0; transform: translate3d(var(--x), var(--y), 0) scale(0.5); }
            50% { opacity: 1; transform: translate3d(var(--x), var(--y), 50px) scale(1); }
            100% { opacity: 0; transform: translate3d(var(--x), var(--y), 100px) scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="container" id="heart-container">
        </div>

    <script>
        const container = document.getElementById('heart-container');
        const wordsCount = 100; // Cantidad de frases

        for (let i = 0; i < wordsCount; i++) {
            const word = document.createElement('div');
            word.className = 'love-word';
            word.innerText = 'I love you';

            // Ecuación matemática del corazón
            const t = (i / wordsCount) * 2 * Math.PI;
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

            // Escalar la posición para que se vea en pantalla
            const scale = 15; 
            word.style.setProperty('--x', `${x * scale + 300}px`);
            word.style.setProperty('--y', `${y * scale + 250}px`);

            // Retraso aleatorio para que no aparezcan todas al mismo tiempo
            word.style.animationDelay = `${Math.random() * 4}s`;

            container.appendChild(word);
        }
    </script>
</body>
</html>
